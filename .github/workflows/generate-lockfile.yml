name: Generate Lockfile

on:
  push:
    branches: [feature/dependency-compat]
    paths:
      - "package.json"
      - "bun.lock"
      - ".github/workflows/generate-lockfile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-lockfile:
    name: Generate bun.lock from updated package.json
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Install dependencies (generate lockfile)
        id: install
        run: |
          set -e
          echo "=== package.json ==="
          cat package.json
          echo ""
          echo "=== Running bun install (generates bun.lock) ==="
          bun install 2>&1 | tee /tmp/install.log
          echo ""
          echo "=== Lockfile generated ==="
          ls -la bun.lock
          echo ""
          echo "=== Checking for peer dependency warnings ==="
          if grep -qi "peer dep\|peer-depend\|unmet peer\|missing peer" /tmp/install.log 2>/dev/null; then
            echo "PEER_WARNINGS_FOUND=true" >> $GITHUB_OUTPUT
            grep -i "peer dep\|peer-depend\|unmet peer\|missing peer" /tmp/install.log || true
          else
            echo "PEER_WARNINGS_FOUND=false" >> $GITHUB_OUTPUT
          fi
          echo ""
          echo "=== Install log tail ==="
          tail -30 /tmp/install.log
      - name: Check resolved React
        run: |
          echo "=== Resolved React versions ==="
          bun pm ls react 2>/dev/null || true
          echo ""
          echo "=== Lockfile React entries ==="
          grep -c '"react@' bun.lock || true
          echo ""
          echo "=== Checking for duplicate Mantine ==="
          grep -c '"@mantine/core@' bun.lock || true
          grep -c '"@mantine/hooks@' bun.lock || true
      - name: Verify no node_modules in working tree
        run: |
          echo "node_modules exists: $(test -d node_modules && echo YES || echo NO)"
          echo "Bun cache exists: $(test -d .bun && echo YES || echo NO)"
      - name: Commit and push lockfile if needed
        run: |
          git config user.name "RTWiki"
          git config user.email "rtwiki@rtwiki.local"
          # Only commit if bun.lock was actually added/changed
          git add bun.lock
          if git diff --cached --quiet; then
            echo "bun.lock is already up to date, nothing to commit"
          else
            git commit -m "chore: regenerate bun.lock for BlockNote 0.54.0 + Mantine 8.3.18"
            git push
          fi
      - name: Upload install log
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: install-log
          path: /tmp/install.log
          retention-days: 1
      - name: Upload lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bun-lockfile
          path: bun.lock
          retention-days: 1

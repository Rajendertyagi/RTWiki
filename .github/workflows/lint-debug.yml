name: Lint Debug

on:
  workflow_dispatch:
  push:
    branches: [feature/dependency-compat]

permissions:
  contents: read

jobs:
  lint-debug:
    name: Lint debug
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check biome version
        run: bunx biome --version
      - name: Check biome config
        run: cat biome.json
      - name: Run biome lint verbose
        run: |
          set +e
          echo "=== Running biome lint ==="
          bunx biome lint . --verbose 2>&1 || true
          echo ""
          echo "=== Running biome lint with --diagnostic-level ==="
          bunx biome lint . --diagnostic-level=error 2>&1 || true
          echo ""
          echo "=== Checking biome.json validity ==="
          bunx biome check biome.json 2>&1 || true
      - name: Upload lint log
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lint-debug-log
          path: /tmp/lint-verbose.txt
          retention-days: 1
          if-no-files-found: warn

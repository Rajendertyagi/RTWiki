name: Lint diagnostics

# TEMPORARY, read-only diagnostic workflow. Surfaces `bun run lint` output
# through public check-run annotations because job logs require
# authentication this environment lacks.
# - Branch-specific trigger only
# - contents: read (no repository writes)
# - No secrets, no commits, no pushes from Actions
# - Deleted before the dependency-free baseline is declared complete
on:
  push:
    branches: [feature/workspace-hierarchy]

permissions:
  contents: read

jobs:
  lint-patch:
    name: Surface lint findings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Run linter, capture output
        run: |
          set +e
          bun run lint > lint-output.txt 2>&1
          echo "lint exit: $?" >> lint-output.txt
          true
      - name: Publish output annotations (first half)
        # Base64 avoids annotation escaping issues; `for` over word-split
        # tokens cannot drop a final chunk lacking a trailing newline.
        run: |
          TOTAL=$(base64 -w0 lint-output.txt | fold -w 4000 | wc -l)
          N=0
          for CHUNK in $(base64 -w0 lint-output.txt | fold -w 4000); do
            N=$((N+1))
            if [ "$N" -le 4 ]; then
              echo "::error title=lntout part $N of $TOTAL::$CHUNK"
            fi
          done
      - name: Publish output annotations (remainder)
        run: |
          TOTAL=$(base64 -w0 lint-output.txt | fold -w 4000 | wc -l)
          N=0
          for CHUNK in $(base64 -w0 lint-output.txt | fold -w 4000); do
            N=$((N+1))
            if [ "$N" -gt 4 ]; then
              echo "::error title=lntout part $N of $TOTAL::$CHUNK"
            fi
          done

name: Lockfile Refresh

# TEMPORARY workflow. It regenerates bun.lock on GitHub (never locally), then the
# resulting bun.lock is downloaded and committed, after which this file is deleted.
# The `push` trigger is only so this branch-only workflow can be run on GitHub
# (workflow_dispatch is not addressable for non-default branches via the API).
on:
  workflow_dispatch:
  push:
    branches:
      - feature/mvp-foundation

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/mvp-foundation
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Regenerate lockfile
        run: bun install --lockfile-only --ignore-scripts
      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bun-lock
          path: bun.lock

name: Regenerate Lockfile

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate:
    name: Regenerate bun.lock
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Regenerate lockfile
        run: |
          set -e
          rm -f bun.lock
          bun install 2>&1 | tee /tmp/install.log
          cat /tmp/install.log
      - name: Check peer warnings
        run: |
          if grep -qi "peer dep\|unmet peer" /tmp/install.log; then
            echo "PEER WARNINGS FOUND"
            grep -i "peer dep\|unmet peer" /tmp/install.log
          else
            echo "No peer warnings"
          fi
      - name: Commit lockfile
        run: |
          git config user.name "RTWiki"
          git config user.email "rtwiki@rtwiki.local"
          git add bun.lock
          git commit -m "chore: regenerate bun.lock for upgraded dependency stack" || echo "No lockfile changes"
          git push
      - name: Upload lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bun-lockfile
          path: bun.lock
          retention-days: 1

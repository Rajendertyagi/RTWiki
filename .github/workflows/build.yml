name: Build and Package

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

# Least-privilege: this workflow only reads the repo and downloads an artifact.
# It never pushes, never modifies itself, and never uses continue-on-error or `|| true`
# on gates that must be authoritative. upload-artifact@v4 operates within the same run
# and needs no extra permission beyond contents: read.
permissions:
  contents: read

jobs:
  verify:
    name: Verify (format, lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Format check
        run: bun run format:check
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun test
      - name: Build web
        run: bun run build:web
      - name: Build server (compile executable)
        run: bun run build:server

  windows-smoke:
    name: Windows portable package smoke test
    runs-on: windows-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Build web
        run: bun run build:web
      - name: Build server (compile portable executable)
        run: bun run build:server

      # Fail loudly if the build did not produce the expected independent artifacts.
      - name: Pre-fail build checks
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "build/server/RTWiki.exe"
          $idx = "build/web/index.html"
          $assets = "build/web/assets"
          if (-not (Test-Path $exe -PathType Leaf)) { throw "Missing build artifact: $exe" }
          if ((Get-Item $exe).Length -eq 0) { throw "Executable is empty: $exe" }
          if (-not (Test-Path $idx -PathType Leaf)) { throw "Missing build artifact: $idx" }
          if ((Get-Item $idx).Length -eq 0) { throw "index.html is empty: $idx" }
          if (-not (Test-Path $assets -PathType Container)) { throw "Missing build artifact directory: $assets" }
          $assetFiles = Get-ChildItem -Path $assets -Recurse -File
          if ($assetFiles.Count -eq 0) { throw "No files found under: $assets" }
          Write-Host "PRE-FAIL CHECKS PASSED: exe=$((Get-Item $exe).Length)B, index.html, assets/ ($($assetFiles.Count) files)"

      # Stage a portable tree: the executable and the built frontend beside it.
      - name: Stage portable package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = "package/RTWiki"
          New-Item -ItemType Directory -Force -Path "$stage/web" | Out-Null
          Copy-Item "build/server/RTWiki.exe" -Destination "$stage/RTWiki.exe" -Force
          Copy-Item "build/web/index.html" -Destination "$stage/web/index.html" -Force
          Copy-Item "build/web/assets" -Destination "$stage/web/assets" -Recurse -Force

          # Required staged files must be present and non-empty.
          $required = @(
            "$stage/RTWiki.exe",
            "$stage/web/index.html"
          )
          foreach ($f in $required) {
            if (-not (Test-Path $f -PathType Leaf)) { throw "Missing staged file: $f" }
            if ((Get-Item $f).Length -eq 0) { throw "Staged file is empty: $f" }
          }
          $stagedAssets = Get-ChildItem -Path "$stage/web/assets" -Recurse -File
          if ($stagedAssets.Count -eq 0) { throw "No staged asset files under: $stage/web/assets" }
          Write-Host "STAGED TREE:"
          Get-ChildItem -Recurse $stage | ForEach-Object { Write-Host "  $($_.FullName) ($($_.Length)B)" }

      # Archive the *contents* of package/RTWiki so extraction yields RTWiki.exe + web/ at the root.
      - name: Compress portable package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Compress-Archive -Path 'package/RTWiki/*' -DestinationPath RTWiki-0.1.0-windows-x64.zip -Force

      # Extract to an isolated directory and run from a *different* working directory to prove
      # the executable is portable (it derives all paths from its own location, never cwd).
      # Uses the supported --no-open startup flag (openBrowser:false) so the server keeps
      # listening on 127.0.0.1:8080 for independent external HTTP verification.
      - name: Extract and run portable smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $extract = Join-Path $env:RUNNER_TEMP "rtwiki-smoke"
          $runDir = Join-Path $env:RUNNER_TEMP "rtwiki-run"
          $exe = Join-Path $extract "RTWiki.exe"
          $out = Join-Path $extract "smoke.out.txt"
          $err = Join-Path $extract "smoke.err.txt"
          $log = Join-Path $extract "logs" "rtwiki.log"

          Remove-Item -Recurse -Force $extract -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force $runDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $runDir | Out-Null
          Expand-Archive -Path RTWiki-0.1.0-windows-x64.zip -DestinationPath $extract -Force

          # ADR-005 marks attachments/ and backups/ as lazy (not created at startup). Pre-create
          # the expected empty portable directories so the packaged layout is complete.
          New-Item -ItemType Directory -Force -Path (Join-Path $extract "data" "attachments") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $extract "data" "backups") | Out-Null

          $p = $null
          try {
            if (-not (Test-Path $exe)) { throw "RTWiki.exe missing after extraction" }
            $p = Start-Process -FilePath $exe -ArgumentList "--no-open" -WorkingDirectory $runDir -NoNewWindow -PassThru -RedirectStandardOutput $out -RedirectStandardError $err

            # 1. Server starts within a bounded timeout.
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              if ($p.HasExited) { throw "Executable exited early (code $($p.ExitCode)) before becoming ready" }
              try {
                $r = Invoke-WebRequest -Uri "http://127.0.0.1:8080/health" -UseBasicParsing -TimeoutSec 2
                if ($r.StatusCode -eq 200) { $ready = $true; break }
              } catch { }
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { throw "Server did not become ready within 60s" }

            # 2. Health endpoint returns HTTP 200 and expected response.
            $h = Invoke-WebRequest -Uri "http://127.0.0.1:8080/health" -UseBasicParsing
            if ($h.StatusCode -ne 200) { throw "Health endpoint returned $($h.StatusCode)" }
            if ($h.Content -notmatch '"status"\s*:\s*"ok"') { throw "Health endpoint did not report ok: $($h.Content)" }

            # 3. Root returns HTTP 200 and non-empty HTML.
            $root = Invoke-WebRequest -Uri "http://127.0.0.1:8080/" -UseBasicParsing
            if ($root.StatusCode -ne 200) { throw "GET / returned $($root.StatusCode)" }
            if ([string]::IsNullOrWhiteSpace($root.Content)) { throw "GET / returned empty HTML" }

            # 4. Parse ALL local <script src> and <link href> assets from index.html.
            $scriptPattern = '(?i)<script\s+[^>]*src="(/assets/[^"]+)"'
            $linkPattern = '(?i)<link\s+[^>]*href="(/assets/[^"]+)"'
            $scriptMatches = [regex]::Matches($root.Content, $scriptPattern)
            $linkMatches = [regex]::Matches($root.Content, $linkPattern)

            $assetUrls = @()
            foreach ($m in $scriptMatches) { $assetUrls += $m.Groups[1].Value }
            foreach ($m in $linkMatches) { $assetUrls += $m.Groups[1].Value }

            if ($assetUrls.Count -eq 0) { throw "No <script src> or <link href> assets found in index.html" }

            $jsFound = $false
            $cssFound = $false

            foreach ($assetUrl in $assetUrls) {
              $fullUrl = "http://127.0.0.1:8080$assetUrl"
              $a = Invoke-WebRequest -Uri $fullUrl -UseBasicParsing

              # 5. Each asset must return HTTP 200.
              if ($a.StatusCode -ne 200) { throw "Asset $fullUrl returned $($a.StatusCode)" }
              if ([string]::IsNullOrWhiteSpace($a.Content)) { throw "Asset $fullUrl returned empty body" }

              # 6. Must have a non-HTML MIME type.
              $contentType = $a.Headers['Content-Type']
              if ($contentType -match 'text/html') { throw "Asset $fullUrl returned text/html MIME (likely SPA fallback). Content-Type: $contentType" }

              # 7. Verify JS and CSS types found.
              if ($assetUrl -match '\.js$') { $jsFound = $true }
              if ($assetUrl -match '\.css$') { $cssFound = $true }

              # 8. Compare file size against physical asset (use RawContentStream for true byte count).
              $physicalPath = Join-Path $extract "web$assetUrl"
              if (Test-Path $physicalPath) {
                $physicalSize = (Get-Item $physicalPath).Length
                $remoteSize = $a.RawContentStream.Length
                if ($remoteSize -ne $physicalSize) { throw "Asset $fullUrl size mismatch: remote=$remoteSize physical=$physicalSize" }
              }

              Write-Host "ASSET OK: $assetUrl ($contentType) $($a.RawContentStream.Length)B"
            }

            # 9. Require at least one JS and one CSS asset when both are produced.
            if (-not $jsFound) { throw "No JavaScript asset found in index.html" }
            if (-not $cssFound) { throw "No CSS asset found in index.html" }

            # 10. Single-instance: start a second RTWiki instance.
            $secondOut = Join-Path $extract "smoke2.out.txt"
            $secondErr = Join-Path $extract "smoke2.err.txt"
            $secondP = Start-Process -FilePath $exe -ArgumentList "--no-open" -WorkingDirectory $runDir -NoNewWindow -PassThru -RedirectStandardOutput $secondOut -RedirectStandardError $secondErr

            # Wait up to 10s for the second instance to exit (it should detect the first and exit).
            $exited = $false
            for ($i = 0; $i -lt 10; $i++) {
              if ($secondP.HasExited) { $exited = $true; break }
              Start-Sleep -Seconds 1
            }

            if (-not $exited) {
              # Kill the second instance if it didn't exit.
              Stop-Process -Id $secondP.Id -Force -ErrorAction SilentlyContinue
              throw "Second RTWiki instance did not exit within 10s (should detect existing and exit)"
            }

            if ($secondP.ExitCode -ne 0) {
              $secondOutContent = Get-Content $secondOut -ErrorAction SilentlyContinue
              $secondErrContent = Get-Content $secondErr -ErrorAction SilentlyContinue
              throw "Second RTWiki instance exited with code $($secondP.ExitCode). Stdout: $secondOutContent Stderr: $secondErrContent"
            }

            # 11. First instance must still be healthy.
            $verifyHealth = Invoke-WebRequest -Uri "http://127.0.0.1:8080/health" -UseBasicParsing
            if ($verifyHealth.StatusCode -ne 200) { throw "First instance health check failed after second launch" }
            Write-Host "SINGLE-INSTANCE OK: second instance exited 0, first remains healthy"

            # 12. Shutdown API security: POST without token must be rejected.
            try {
              $noTokenRes = Invoke-WebRequest -Uri "http://127.0.0.1:8080/api/shutdown" -Method POST -UseBasicParsing
              throw "POST /api/shutdown without token returned $($noTokenRes.StatusCode) (expected 403)"
            } catch {
              $errStr = $_.Exception.Message
              if ($errStr -match "403") {
                Write-Host "SHUTDOWN SECURITY OK: POST without token rejected (403)"
              } else {
                throw "POST /api/shutdown without token: unexpected error: $errStr"
              }
            }

            # 13. Shutdown API security: GET on POST endpoint must return 405.
            try {
              $getRes = Invoke-WebRequest -Uri "http://127.0.0.1:8080/api/shutdown" -Method GET -UseBasicParsing
              throw "GET /api/shutdown returned $($getRes.StatusCode) (expected 405)"
            } catch {
              $errStr = $_.Exception.Message
              if ($errStr -match "405") {
                Write-Host "SHUTDOWN SECURITY OK: GET on shutdown endpoint rejected (405)"
              } else {
                throw "GET /api/shutdown: unexpected error: $errStr"
              }
            }

            # 14. Obtain shutdown token.
            $tokenRes = Invoke-WebRequest -Uri "http://127.0.0.1:8080/api/shutdown/token" -UseBasicParsing
            if ($tokenRes.StatusCode -ne 200) { throw "GET /api/shutdown/token returned $($tokenRes.StatusCode)" }
            $tokenObj = $tokenRes.Content | ConvertFrom-Json
            $shutdownToken = $tokenObj.token
            if ([string]::IsNullOrWhiteSpace($shutdownToken)) { throw "Shutdown token is empty" }
            Write-Host "SHUTDOWN TOKEN OK: obtained token ($($shutdownToken.Length) chars)"

            # 15. Shutdown API security: wrong token must be rejected.
            try {
              $wrongRes = Invoke-WebRequest -Uri "http://127.0.0.1:8080/api/shutdown" -Method POST -Headers @{"X-RTWiki-Shutdown-Token"="wrong-token"} -UseBasicParsing
              throw "POST /api/shutdown with wrong token returned $($wrongRes.StatusCode) (expected 403)"
            } catch {
              $errStr = $_.Exception.Message
              if ($errStr -match "403") {
                Write-Host "SHUTDOWN SECURITY OK: wrong token rejected (403)"
              } else {
                throw "POST /api/shutdown with wrong token: unexpected error: $errStr"
              }
            }

            # 16. Authorized shutdown: correct token must trigger clean stop (202).
            $shutdownRes = Invoke-WebRequest -Uri "http://127.0.0.1:8080/api/shutdown" -Method POST -Headers @{"X-RTWiki-Shutdown-Token"=$shutdownToken} -UseBasicParsing
            if ($shutdownRes.StatusCode -ne 202) { throw "Authorized shutdown returned $($shutdownRes.StatusCode) (expected 202)" }
            $shutdownBody = $shutdownRes.Content | ConvertFrom-Json
            if ($shutdownBody.status -ne "shutting_down") { throw "Shutdown response status: $($shutdownBody.status)" }

            # Wait for server to stop (up to 10 seconds).
            $stopped = $false
            for ($i = 0; $i -lt 10; $i++) {
              Start-Sleep -Seconds 1
              try {
                $check = Invoke-WebRequest -Uri "http://127.0.0.1:8080/health" -UseBasicParsing -TimeoutSec 1
                if (-not $check) { $stopped = $true; break }
              } catch {
                $stopped = $true; break
              }
            }
            if (-not $stopped) { throw "Server did not stop within 10s after authorized shutdown" }
            Write-Host "SHUTDOWN OK: server stopped cleanly after authorized request"

            # Confirm port 8080 no longer accepts connections.
            try {
              $portCheck = Invoke-WebRequest -Uri "http://127.0.0.1:8080/health" -UseBasicParsing -TimeoutSec 2
              throw "Port 8080 still accepts connections after shutdown"
            } catch {
              $errStr = $_.Exception.Message
              if ($errStr -match "Connection refused|400|cannot be reached") {
                Write-Host "PORT RELEASED: 8080 no longer accepts connections"
              } else {
                # Any non-200 response confirms the port is not serving.
                Write-Host "PORT RELEASED: 8080 not serving (got: $errStr)"
              }
            }

            # 17. Verify no orphan processes.
            $orphanCheck = Get-Process -Name "RTWiki" -ErrorAction SilentlyContinue
            if ($orphanCheck) {
              Stop-Process -Id $orphanCheck.Id -Force -ErrorAction SilentlyContinue
              throw "Orphan RTWiki process found after shutdown"
            }
            Write-Host "NO ORPHANS: all RTWiki processes terminated"

            Write-Host "SMOKE TEST PASSED"
            Write-Host "HEALTH=$(($h.Content))"
          } catch {
            Write-Error "SMOKE FAILURE: $_"
            Write-Host "=== STDOUT ==="; Get-Content $out -ErrorAction SilentlyContinue
            Write-Host "=== STDERR ==="; Get-Content $err -ErrorAction SilentlyContinue
            Write-Host "=== RTWiki LOG ==="; Get-Content $log -ErrorAction SilentlyContinue
            Write-Host "=== REQUESTED URL === http://127.0.0.1:8080/"
            Write-Host "=== EXTRACTED TREE ==="; Get-ChildItem -Recurse $extract | ForEach-Object { Write-Host "  $($_.FullName)" }
            throw
          } finally {
            if ($p -and -not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
            if ($secondP -and -not $secondP.HasExited) { Stop-Process -Id $secondP.Id -Force -ErrorAction SilentlyContinue }
          }

      # Upload only after the smoke test has passed (the previous step fails the job otherwise).
      - name: Upload portable package artifact
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: RTWiki-0.1.0-windows-x64
          path: RTWiki-0.1.0-windows-x64.zip
          if-no-files-found: error
          retention-days: 7

      - name: Report artifact hash
        if: success()
        shell: pwsh
        run: |
          $zip = Get-Item RTWiki-0.1.0-windows-x64.zip
          Write-Host "ARTIFACT_NAME=RTWiki-0.1.0-windows-x64.zip"
          Write-Host "ARTIFACT_SIZE_BYTES=$($zip.Length)"
          Write-Host "ZIP_SHA256=$((Get-FileHash $zip.FullName -Algorithm SHA256).Hash)"
          Write-Host "=== EXTRACTED TREE ==="
          Get-ChildItem -Recurse "$env:RUNNER_TEMP\rtwiki-smoke" | ForEach-Object { Write-Host "  $($_.FullName)" }

name: Build and Package

on:
  push:
    branches: [feature/mvp-foundation]
  pull_request:
    branches: [feature/mvp-foundation]

# Least-privilege: this workflow only reads the repo and downloads an artifact.
# It never pushes, never modifies itself, and never uses continue-on-error or `|| true`
# on gates that must be authoritative.
permissions:
  contents: read

jobs:
  verify:
    name: Verify (format, lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Format check
        run: bun run format:check
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun test
      - name: Build web
        run: bun run build:web
      - name: Build server (compile executable)
        run: bun run build:server

  windows-smoke:
    name: Windows executable smoke test
    runs-on: windows-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Build web
        run: bun run build:web
      - name: Build server (compile executable)
        run: bun run build:server

      - name: Package executable
        run: Compress-Archive -Path dist -DestinationPath RTWiki.zip
        shell: pwsh

      # Extract to a different directory and run from there to prove the executable
      # is portable and cwd-independent (it derives all paths from its own location).
      - name: Extract and run smoke test
        run: |
          $extract = "$env:RUNNER_TEMP\rtwiki-smoke"
          Remove-Item -Recurse -Force $extract -ErrorAction SilentlyContinue
          Expand-Archive -Path RTWiki.zip -DestinationPath $extract
          $p = Start-Process -FilePath "$extract\dist\RTWiki.exe" -ArgumentList "--smoke-test" -Wait -PassThru -WorkingDirectory $extract -RedirectStandardOutput "$extract\smoke.out.txt" -RedirectStandardError "$extract\smoke.err.txt"
          Write-Host "=== STDOUT ==="; Get-Content "$extract\smoke.out.txt" -ErrorAction SilentlyContinue
          Write-Host "=== STDERR ==="; Get-Content "$extract\smoke.err.txt" -ErrorAction SilentlyContinue
          Write-Host "=== RTWiki LOG ==="; Get-Content "$extract\dist\logs\rtwiki.log" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "Smoke test failed with exit code $($p.ExitCode)" }
        shell: pwsh

      - name: Report artifact
        if: always()
        run: |
          $zip = Get-Item RTWiki.zip
          $exe = Get-Item "$env:RUNNER_TEMP\rtwiki-smoke\dist\RTWiki.exe"
          Write-Host "ARTIFACT_NAME=RTWiki.zip"
          Write-Host "ARTIFACT_TREE:"
          Get-ChildItem -Recurse "$env:RUNNER_TEMP\rtwiki-smoke" | ForEach-Object { Write-Host "  $($_.FullName)" }
          Write-Host "ARTIFACT_SIZE_BYTES=$($zip.Length)"
          Write-Host "EXE_SHA256=$((Get-FileHash $exe.FullName -Algorithm SHA256).Hash)"
          Write-Host "ZIP_SHA256=$((Get-FileHash $zip.FullName -Algorithm SHA256).Hash)"
        shell: pwsh

      # Upload only after the smoke test has passed (the previous step would have failed otherwise).
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: RTWiki-windows
          path: RTWiki.zip

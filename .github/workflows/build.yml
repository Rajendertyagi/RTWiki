name: Build and Package

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main]

# Least privilege: the workflow reads the repo and runs fast verification
# (format, lint, typecheck, unit tests) plus Playwright browser tests. The
# Windows build and smoke test live in separate, independent workflows.
#
# ## Why these jobs run on Windows, not Linux
#
# RTWiki ships as a portable Windows artifact (ADR-005): a `.zip` holding
# `RTWiki.exe` and its assets, with all mutable data beside the executable.
# Windows is therefore the only platform the product actually runs on, and it is
# the only platform on which a test failure is worth acting on.
#
# These jobs previously ran on `ubuntu-latest`, which is a mismatch with the
# shipped artifact and produced failures that do not exist on the target OS.
# Measured, on the same commit, in both places:
#
#   - `tests/pane-divider.*` - Mantine writes `data-mantine-color-scheme` onto
#     the document element on Linux and not on Windows.
#   - `tests/backup-restore-rollback.test.ts:118` - child-process and filesystem
#     behaviour differs between the two platforms.
#   - `tests/markdown-mermaid-hydrate.test.ts:451` - fails on the Linux runner,
#     passes on Windows.
#
# `main` had been red on these since 2026-09-24 for exactly this reason, while
# the same suite passed locally on Windows. A Linux runner cannot tell us
# whether a Windows build works, so it is the wrong gate for this repository.
# The Windows compile and smoke test remain in their own workflows.
permissions:
  contents: read

jobs:
  verify:
    name: Verify (format, lint, typecheck, test, build)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Format check
        run: bun run format:check
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun test
      - name: Build web
        run: bun run build:web
      - name: Build server (compile executable)
        run: bun run build:server

  browser-tests:
    name: Browser tests (Playwright, real application)
    # See the note above: the product is a portable Windows artifact, so the
    # browser suite must run where the application actually runs.
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Build web
        run: bun run build:web
      # The development-mode server resolves the SPA to <repo>/build/web.
      - name: Measure web bundle (informational, no threshold)
        run: bun scripts/measure-bundle.ts
      - name: Install Playwright Chromium
        # No `--with-deps`: that flag installs Linux system packages and is
        # meaningless on a Windows runner. The Windows image already carries
        # everything Chromium needs.
        run: bunx playwright install chromium
      - name: Run browser tests against the built application
        run: bunx playwright test
      - name: Upload browser-test failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-diagnostics
          path: |
            test-results/
          if-no-files-found: ignore
          retention-days: 7

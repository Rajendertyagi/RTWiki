# GitHub Actions build and package workflow

name: Build and Package

on:
  push:
    branches: [main, 'feature/mvp-foundation']
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'vitest.config.ts'
      - 'biome.json'
      - '.github/workflows/*.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'vitest.config.ts'
      - 'biome.json'
      - '.github/workflows/*.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # v4.1.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2 # v2.0.0
        with:
          bun-version: '1.3.14'

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Frontend build
        run: bun run build:web

      - name: Backend build
        run: bun run build:server

  package:
    name: Package Windows Artifact
    runs-on: windows-latest
    needs: quality
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/mvp-foundation') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4 # v4.1.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2 # v2.0.0
        with:
          bun-version: '1.3.14'

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Build frontend
        run: bun run build:web

      - name: Compile executable
        run: bun run build:server

      - name: Stage portable artifact
        run: |
          $version = "0.1.0"
          $artifactName = "RTWiki-${version}-windows-x64"
          $stagingDir = "dist/staging/${artifactName}"
          New-Item -ItemType Directory -Force -Path $stagingDir | Out-Null
          New-Item -ItemType Directory -Force -Path "$stagingDir/data/attachments" | Out-Null
          New-Item -ItemType Directory -Force -Path "$stagingDir/data/backups" | Out-Null
          New-Item -ItemType Directory -Force -Path "$stagingDir/logs" | Out-Null
          Copy-Item "dist/RTWiki.exe" "$stagingDir/RTWiki.exe"
          if (Test-Path "dist/web") {
            Copy-Item -Recurse "dist/web/*" "$stagingDir/dist/web/"
          }
          Compress-Archive -Path "$stagingDir/*" -DestinationPath "RTWiki-${version}-windows-x64.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4 # v4.3.0
        with:
          name: RTWiki-0.1.0-windows-x64
          path: RTWiki-0.1.0-windows-x64.zip
          retention-days: 90

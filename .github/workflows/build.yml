name: Build and Package

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main]

# Least privilege: the workflow reads the repo and runs fast verification
# (format, lint, typecheck, unit tests) plus Playwright browser tests. The
# Windows build and smoke test live in separate, independent workflows.
permissions:
  contents: read

jobs:
  verify:
    name: Verify (format, lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Format check
        run: bun run format:check
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun test
      - name: Build web
        run: bun run build:web
      - name: Build server (compile executable)
        run: bun run build:server

  browser-tests:
    name: Browser tests (Playwright, real application)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Build web
        run: bun run build:web
      # The development-mode server resolves the SPA to <repo>/build/web.
      - name: Measure web bundle (informational, no threshold)
        run: bun scripts/measure-bundle.ts
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Run browser tests against the built application
        run: bunx playwright test
      - name: Upload browser-test failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-diagnostics
          path: |
            test-results/
          if-no-files-found: ignore
          retention-days: 7

name: Temporary remote format apply

# TEMPORARY workflow — runs the formatter on a GitHub Actions runner and
# uploads the result as a git patch artifact (local machine is edit/Git
# only). Removed before the final push.

on:
  push:
    branches:
      - feature/tree-foundation-workspace-polish
    paths:
      - '.github/workflows/tmp-format.yml'

permissions:
  contents: read

jobs:
  format:
    name: Apply Biome format + safe fixes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Apply formatter and safe fixes
        run: bunx biome check --write .
        # Rerun marker: 2026-09-04T21:40Z

      - name: Create patch
        shell: bash
        run: |
          git diff > /tmp/format.patch
          if [ ! -s /tmp/format.patch ]; then
            echo "No formatting changes needed" > /tmp/format-empty.txt
          fi

      - name: Upload patch
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: format-patch
          path: |
            /tmp/format.patch
            /tmp/format-empty.txt
          if-no-files-found: warn
          retention-days: 7

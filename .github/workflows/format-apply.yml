name: Format Apply
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: bunx biome check --write src/web/App.tsx src/web/config/index.ts src/web/features/pages/page-tab.tsx src/web/features/rich-editor/document.ts src/web/features/rich-editor/rich-editor.tsx src/web/layout/sidebar.tsx src/web/layout/utility-rail.tsx tests/rich-editor-document.test.ts tests/autosave-controller.test.ts tests/shutdown-controller.test.ts tests/workspace.test.ts 2>&1 | tee /tmp/fmt.log; cat /tmp/fmt.log
      - run: git diff --stat; git diff src/web/App.tsx | head -80
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: formatted-files
          path: |
            src/web/App.tsx
            src/web/config/index.ts
            src/web/features/pages/page-tab.tsx
            src/web/features/rich-editor/document.ts
            src/web/features/rich-editor/rich-editor.tsx
            src/web/layout/sidebar.tsx
            src/web/layout/utility-rail.tsx
            tests/rich-editor-document.test.ts
            tests/autosave-controller.test.ts
            tests/shutdown-controller.test.ts
            tests/workspace.test.ts

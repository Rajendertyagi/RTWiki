name: Dependency Migration Resolution

on:
  push:
    branches: [feature/dependency-compat]
    paths:
      - ".github/workflows/dependency-migration-temp.yml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve and validate latest compatible dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Query npm registry and generate candidate package.json
        id: resolve
        run: |
          set -e
          cat > /tmp/resolve.ts << 'TSEOF'
          import https from "node:https"
          import fs from "node:fs"
          
          async function fetchPkg(pkg: string): Promise<Record<string, unknown>> {
            return new Promise((resolve, reject) => {
              const req = https.get(`https://registry.npmjs.org/${pkg}`, {
                headers: { Accept: "application/json" }
              }, (res) => {
                let data = ""
                res.on("data", (c) => data += c)
                res.on("end", () => {
                  try { resolve(JSON.parse(data)) }
                  catch { reject(new Error(data.slice(0, 200))) }
                })
              })
              req.on("error", reject)
              req.end()
            })
          }
          
          async function main() {
            const pkgs = [
              "react", "react-dom", "@types/react", "@types/react-dom",
              "@mantine/core", "@mantine/hooks", "@mantine/utils",
              "@blocknote/core", "@blocknote/react", "@blocknote/mantine",
              "vite", "@vitejs/plugin-react",
              "typescript", "@biomejs/biome",
              "hono", "zod", "@tabler/icons-react",
              "@types/node", "@types/bun"
            ]
            
            const results: Record<string, { version: string; peerDeps: Record<string, string>; allTags: Record<string, string> }> = {}
            
            for (const pkg of pkgs) {
              try {
                const data = await fetchPkg(pkg) as {
                  "dist-tags": Record<string, string>
                  versions: Record<string, { peerDependencies?: Record<string, string>; version: string }>
                }
                const latest = data["dist-tags"]["latest"]
                const v = data.versions[latest]
                results[pkg] = {
                  version: latest,
                  peerDeps: v?.peerDependencies ?? {},
                  allTags: data["dist-tags"]
                }
                console.log(`${pkg}@${latest}  peerDeps=${JSON.stringify(v?.peerDependencies ?? {})}`)
              } catch (e) {
                console.error(`FAILED ${pkg}: ${e}`)
                results[pkg] = { version: "ERROR", peerDeps: {}, allTags: {} }
              }
            }
            
            // Version range analysis
            console.log("\n=== VERSION RANGE ANALYSIS ===")
            
            // Vite versions
            const viteData = results["vite"]
            const viteVersions = Object.keys((await fetchPkg("vite")) as { versions: Record<string, unknown> }).filter((v: string) => /^5\./.test(v) || /^6\./.test(v) || /^8\./.test(v)).sort((a: string, b: string) => b.localeCompare(a))
            console.log(`Vite 5.x latest: ${viteVersions.find((v: string) => v.startsWith("5."))}`)
            console.log(`Vite 6.x latest: ${viteVersions.find((v: string) => v.startsWith("6."))}`)
            console.log(`Vite 8.x latest: ${viteVersions.find((v: string) => v.startsWith("8."))}`)
            
            // Mantine versions
            const mantineData = await fetchPkg("@mantine/core") as { versions: Record<string, { peerDependencies?: Record<string, string> }> }
            const m8 = Object.keys(mantineData.versions).filter((v: string) => v.startsWith("8.")).sort((a, b) => b.localeCompare(a))[0]
            const m9 = Object.keys(mantineData.versions).filter((v: string) => v.startsWith("9.")).sort((a, b) => b.localeCompare(a))[0]
            console.log(`\nMantine 8.x latest: ${m8}`)
            console.log(`Mantine 9.x latest: ${m9}`)
            console.log(`Mantine 9.x peerDeps: ${JSON.stringify(mantineData.versions[m9]?.peerDependencies)}`)
            
            // Biome versions
            const biomeData = await fetchPkg("@biomejs/biome") as { versions: Record<string, unknown> }
            const b1 = Object.keys(biomeData.versions).filter((v: string) => v.startsWith("1.")).sort((a, b) => b.localeCompare(a))[0]
            const b2 = Object.keys(biomeData.versions).filter((v: string) => v.startsWith("2.")).sort((a, b) => b.localeCompare(a))[0]
            console.log(`\nBiome 1.x latest: ${b1}`)
            console.log(`Biome 2.x latest: ${b2}`)
            
            // Zod versions
            const zodData = await fetchPkg("zod") as { "dist-tags": Record<string, string> }
            const z3 = Object.keys((await fetchPkg("zod")) as { versions: Record<string, unknown> }).filter((v: string) => v.startsWith("3.")).sort((a, b) => b.localeCompare(a))[0]
            console.log(`\nZod 3.x latest: ${z3}`)
            console.log(`Zod dist-tags: ${JSON.stringify(zodData["dist-tags"])}`)
            
            // TypeScript versions
            const tsData = await fetchPkg("typescript") as { versions: Record<string, unknown> }
            const ts5 = Object.keys(tsData.versions).filter((v: string) => v.startsWith("5.")).sort((a, b) => b.localeCompare(a))[0]
            const ts6 = Object.keys(tsData.versions).filter((v: string) => v.startsWith("6.")).sort((a, b) => b.localeCompare(a))[0]
            const ts7 = Object.keys(tsData.versions).filter((v: string) => v.startsWith("7.")).sort((a, b) => b.localeCompare(a))[0]
            console.log(`\nTypeScript 5.x latest: ${ts5}`)
            console.log(`TypeScript 6.x latest: ${ts6}`)
            console.log(`TypeScript 7.x latest: ${ts7}`)
            
            // @types/node versions
            const ntData = await fetchPkg("@types/node") as { versions: Record<string, unknown> }
            const nt22 = Object.keys(ntData.versions).filter((v: string) => v.startsWith("22.")).sort((a, b) => b.localeCompare(a))[0]
            const nt26 = Object.keys(ntData.versions).filter((v: string) => v.startsWith("26.")).sort((a, b) => b.localeCompare(a))[0]
            console.log(`\n@types/node 22.x latest: ${nt22}`)
            console.log(`@types/node 26.x latest: ${nt26}`)
            
            // @mantine/utils - critical check
            const utilsData = await fetchPkg("@mantine/utils") as { versions: Record<string, unknown> }
            const utilsVers = Object.keys(utilsData.versions).filter((v: string) => v.match(/^6\.|^7\.|^8\.|^9\./)).sort((a, b) => b.localeCompare(a))
            console.log(`\n@mantine/utils 6.x-9.x versions: ${utilsVers.length > 0 ? utilsVers.join(", ") : "NONE"}`)
            
            // Build the candidate package.json
            const pkg = {
              name: "rtwiki",
              version: "0.1.0",
              private: true,
              type: "module",
              scripts: {
                "dev": "bun run --hot src/server/index.ts",
                "dev:web": "vite",
                "build": "bun run build:web && bun run build:server",
                "build:web": "vite build",
                "build:server": "bun run scripts/build.ts",
                "start": "bun run src/server/index.ts",
                "typecheck": "tsc --noEmit",
                "format:check": "biome check --linter-enabled=false --organize-imports-enabled=false .",
                "format:fix": "biome check --write .",
                "format:write": "biome format --write .",
                "lint": "biome lint .",
                "test": "bun test",
                "test:watch": "bun test --watch",
                "test:coverage": "bun test --coverage",
                "db:migrate": "bun run src/server/database/migrations.ts"
              },
              dependencies: {
                "@blocknote/core": results["@blocknote/core"].version,
                "@blocknote/mantine": results["@blocknote/mantine"].version,
                "@blocknote/react": results["@blocknote/react"].version,
                "@mantine/core": results["@mantine/core"].version,
                "@mantine/hooks": results["@mantine/hooks"].version,
                "@tabler/icons-react": results["@tabler/icons-react"].version,
                "hono": results["hono"].version,
                "react": results["react"].version,
                "react-dom": results["react-dom"].version,
                "zod": results["zod"].version
              },
              devDependencies: {
                "@biomejs/biome": results["@biomejs/biome"].version,
                "@types/bun": results["@types/bun"].version,
                "@types/node": results["@types/node"].version,
                "@types/react": results["@types/react"].version,
                "@types/react-dom": results["@types/react-dom"].version,
                "@vitejs/plugin-react": results["@vitejs/plugin-react"].version,
                "typescript": results["typescript"].version,
                "vite": results["vite"].version
              }
            }
            
            fs.writeFileSync("/tmp/candidate-package.json", JSON.stringify(pkg, null, 2) + "\n")
            fs.writeFileSync("/tmp/npm-results.json", JSON.stringify(results, null, 2))
            console.log("\n=== CANDIDATE package.json ===")
            console.log(JSON.stringify(pkg, null, 2))
          }
          
          main().catch((e) => { console.error(e); process.exit(1) })
          TSEOF
          
          bun run /tmp/resolve.ts
          echo ""
          echo "=== COPY CANDIDATE TO REPO ==="
          cp /tmp/candidate-package.json package.json
          cat package.json
      - name: Remove old lockfile and generate new one
        id: lock
        run: |
          set -e
          rm -f bun.lock
          echo "=== Generating bun.lock ==="
          bun install 2>&1 | tee /tmp/install.log
          echo ""
          echo "=== Lockfile generated ==="
          ls -la bun.lock
          head -35 bun.lock
      - name: Check for peer dependency warnings
        id: peers
        run: |
          if grep -qi "peer dep\|peer-depend\|unmet peer\|missing peer\|warn" /tmp/install.log 2>/dev/null; then
            echo "PEER_WARNINGS=1" >> $GITHUB_OUTPUT
            grep -i "peer dep\|peer-depend\|unmet peer\|missing peer\|warn" /tmp/install.log | head -20
          else
            echo "PEER_WARNINGS=0" >> $GITHUB_OUTPUT
          fi
      - name: Check for duplicate React
        run: |
          echo "=== React resolution ==="
          bun pm ls react 2>/dev/null || true
          echo ""
          echo "=== React entries in lockfile ==="
          grep -c '"react@' bun.lock || echo 0
      - name: Check for duplicate Mantine
        run: |
          echo "=== Mantine/core resolution ==="
          bun pm ls "@mantine/core" 2>/dev/null || true
          echo ""
          echo "=== @mantine/core entries in lockfile ==="
          grep -c '"@mantine/core@' bun.lock || echo 0
      - name: Format check
        run: |
          set +e
          bun run format:check 2>&1 | tee /tmp/format.txt
      - name: Lint
        run: |
          set +e
          bun run lint 2>&1 | tee /tmp/lint.txt
      - name: Typecheck
        run: |
          set +e
          bun run typecheck 2>&1 | tee /tmp/typecheck.txt
      - name: Test
        run: |
          set +e
          bun test 2>&1 | tee /tmp/test.txt
      - name: Build web
        run: |
          set +e
          bun run build:web 2>&1 | tee /tmp/build-web.txt
      - name: Build server
        run: |
          set +e
          bun run build:server 2>&1 | tee /tmp/build-server.txt
      - name: Generate compatibility report
        run: |
          {
            echo "# Dependency Migration Compatibility Report"
            echo ""
            echo "## Resolved Versions"
            echo ''
            echo '```json'
            cat /tmp/npm-results.json
            echo '```'
            echo ""
            echo "## Build Results"
            echo "- Format: $([ -f /tmp/format.txt ] && grep -q 'All checks passed' /tmp/format.txt && echo PASS || echo FAILED)"
            echo "- Lint: $([ -f /tmp/lint.txt ] && grep -q 'All checks passed' /tmp/lint.txt && echo PASS || echo FAILED)"
            echo "- Typecheck: $([ -f /tmp/typecheck.txt ] && grep -q 'No errors found' /tmp/typecheck.txt && echo PASS || echo FAILED)"
            echo "- Tests: $([ -f /tmp/test.txt ] && grep -q 'All tests passed' /tmp/test.txt && echo PASS || echo FAILED)"
            echo "- Web build: $([ -f /tmp/build-web.txt ] && grep -q 'built' /tmp/build-web.txt && echo PASS || echo FAILED)"
            echo "- Server build: $([ -f /tmp/build-server.txt ] && grep -q 'compiled\|success' /tmp/build-server.txt && echo PASS || echo FAILED)"
            echo ""
            echo "## Install Log (last 40 lines)"
            echo '```'
            tail -40 /tmp/install.log
            echo '```'
          } > /tmp/compatibility-report.md
          cat /tmp/compatibility-report.md
      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: migration-candidate
          path: |
            package.json
            bun.lock
            /tmp/install.log
            /tmp/format.txt
            /tmp/lint.txt
            /tmp/typecheck.txt
            /tmp/test.txt
            /tmp/build-web.txt
            /tmp/build-server.txt
            /tmp/compatibility-report.md
            /tmp/npm-results.json
          retention-days: 7
          if-no-files-found: warn

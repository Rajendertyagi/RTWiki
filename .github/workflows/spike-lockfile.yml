name: Temporary remote lockfile generation

# TEMPORARY workflow — runs the package manager on a GitHub Actions runner
# and uploads the resulting bun.lock as an artifact, per the task's
# local-tool restriction. Removed before the final push.

on:
  push:
    branches:
      - feature/tree-foundation-workspace-polish
    paths:
      - '.github/workflows/spike-lockfile.yml'
      - 'package.json'

permissions:
  contents: read

jobs:
  lockfile:
    name: Regenerate bun.lock
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: Install (updates lockfile to match package.json)
        run: bun install

      - name: Verify lockfile consistency
        run: bun install --frozen-lockfile

      - name: Verify dependency set
        shell: bash
        run: |
          grep -q '"wunderbaum": "0.14.1"' package.json
          ! grep -q 'atlaskit' package.json
          grep -q 'wunderbaum' bun.lock
          ! grep -q 'atlaskit' bun.lock

      - name: Upload lockfile artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lockfile-update
          path: |
            bun.lock
            package.json
          if-no-files-found: error
          retention-days: 7

name: Format Preview

on:
  push:
    branches: [feature/mvp-foundation]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'biome.json'
      - 'tsconfig.json'
      - 'package.json'
      - 'bun.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    name: Read-only format preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Format workspace (formatting only, no lint fixes)
        run: bun run format:write

      - name: Capture formatting patch
        id: patch
        run: |
          git diff > format.patch
          if [ -s format.patch ]; then echo "has_changes=true" >> "$GITHUB_OUTPUT"; else echo "has_changes=false" >> "$GITHUB_OUTPUT"; fi

      - name: Upload formatting patch
        if: steps.patch.outputs.has_changes == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: biome-format-patch
          path: format.patch
          retention-days: 7

      - name: Lint (report only)
        if: always()
        run: bun run lint

      - name: Typecheck
        if: always()
        run: bun run typecheck

      - name: Tests
        if: always()
        run: bun run test

      - name: Build web
        if: always()
        run: bun run build:web

      - name: Build server
        if: always()
        run: bun run build:server

      - name: Write summary
        if: always()
        run: |
          cat > summary.json <<'EOF'
          {
            "commit": "${{ github.sha }}",
            "runner": "ubuntu-latest",
            "formatPatchPresent": ${{ steps.patch.outputs.has_changes }}
          }
          EOF

      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-summary
          path: summary.json
          retention-days: 7

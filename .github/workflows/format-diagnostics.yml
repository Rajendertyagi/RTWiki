name: Format diagnostics

# TEMPORARY, read-only diagnostic workflow. Produces a patch of the canonical
# Biome formatting diff for this branch and uploads it as an artifact.
# - Branch-specific trigger only
# - contents: read (no repository writes)
# - No secrets, no commits, no pushes from Actions
# - Deleted in the same corrective commit that applies the patch
on:
  push:
    branches: [feature/workspace-hierarchy]

permissions:
  contents: read

jobs:
  format-patch:
    name: Produce canonical formatting patch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Apply canonical formatting in runner workspace only
        # Tolerate a non-zero exit so the artifact is always produced:
        # `check --write` exits 1 when unfixable diagnostics remain even
        # after applying every safe fix. Precedent: Phase 4A (33601ac).
        # `|| true` is required because Actions runs bash with -e.
        run: bun run format:fix || true
      - name: Capture formatting patch
        run: git diff > format.patch
      - name: Publish patch to step summary
        # Logs, artifacts, and summaries require authentication; check-run
        # annotations are publicly readable via the REST API. Emit the patch
        # as indexed base64 chunks so it can be reassembled without auth.
        # A `for` over word-split tokens is used because `while read` drops
        # a final chunk lacking a trailing newline.
        run: |
          {
            echo '### Canonical formatting patch'
            echo '<pre>'
            cat format.patch
            echo '</pre>'
          } >> "$GITHUB_STEP_SUMMARY"
          TOTAL=$(base64 -w0 format.patch | fold -w 4000 | wc -l)
          N=0
          for CHUNK in $(base64 -w0 format.patch | fold -w 4000); do
            N=$((N+1))
            if [ "$N" -le 4 ]; then
              echo "::error title=fmtpatch part $N of $TOTAL::$CHUNK"
            fi
          done
      - name: Publish patch annotations (remainder)
        run: |
          TOTAL=$(base64 -w0 format.patch | fold -w 4000 | wc -l)
          N=0
          for CHUNK in $(base64 -w0 format.patch | fold -w 4000); do
            N=$((N+1))
            if [ "$N" -gt 4 ]; then
              echo "::error title=fmtpatch part $N of $TOTAL::$CHUNK"
            fi
          done

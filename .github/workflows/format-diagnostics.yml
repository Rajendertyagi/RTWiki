name: Format Diagnostics (temporary)

# TEMPORARY workflow — exists only to produce the canonical Biome formatting
# patch and static diagnostics on GitHub-hosted runners, because no project
# tooling may run on the owner's PC. Read-only: it never commits, pushes, or
# writes to the repository. It must be deleted in the same corrective commit
# that lands the verified formatting patch. See docs/VISUAL_MVP_TRACKER.md
# Phase 4A.

on:
  push:
    branches: [feature/html-page-editor]
    paths:
      - '.github/workflows/format-diagnostics.yml'

permissions:
  contents: read

jobs:
  format-diagnostics:
    name: Formatting patch and diagnostics (no repository writes)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Snapshot pre-format state
        run: git status --porcelain > before-format.txt

      # Repository-pinned formatter (package.json "format:fix" -> local
      # @biomejs/biome at the locked version). No bunx, no version fetch.
      # check --write exits nonzero when unfixable lint errors remain; the
      # patch and diagnostics must still be captured, so failures here are
      # tolerated and surfaced via the uploaded outputs instead.
      - name: Run repository formatter
        run: |
          bun run format:fix > formatter-output.txt 2>&1 || true
          tail -n 40 formatter-output.txt

      - name: Capture formatting patch and changed-file list
        run: |
          git diff > biome-format.patch
          git diff --name-only > changed-files.txt

      - name: Format check diagnostics
        run: bun run format:check > diagnostics-format.txt 2>&1 || true

      - name: Lint diagnostics
        run: bun run lint > diagnostics-lint.txt 2>&1 || true

      - name: Typecheck diagnostics
        run: bun run typecheck > diagnostics-typecheck.txt 2>&1 || true

      - name: Upload diagnostics artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: format-diagnostics
          path: |
            biome-format.patch
            changed-files.txt
            before-format.txt
            formatter-output.txt
            diagnostics-format.txt
            diagnostics-lint.txt
            diagnostics-typecheck.txt
          if-no-files-found: error
          retention-days: 7

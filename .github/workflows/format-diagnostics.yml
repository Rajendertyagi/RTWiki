name: Format diagnostics

# TEMPORARY, read-only diagnostic workflow. Produces a patch of the canonical
# Biome formatting diff for this branch and uploads it as an artifact.
# - Branch-specific trigger only
# - contents: read (no repository writes)
# - No secrets, no commits, no pushes from Actions
# - Deleted in the same corrective commit that applies the patch
on:
  push:
    branches: [feature/workspace-hierarchy]

permissions:
  contents: read

jobs:
  format-patch:
    name: Produce canonical formatting patch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Apply canonical formatting in runner workspace only
        # Tolerate a non-zero exit so the artifact is always produced:
        # `check --write` exits 1 when unfixable diagnostics remain even
        # after applying every safe fix. Precedent: Phase 4A (33601ac).
        run: bun run format:fix; exit 0
      - name: Capture formatting patch
        run: git diff > format.patch
      - name: Upload formatting patch
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: format-patch
          path: format.patch
          if-no-files-found: error
          retention-days: 7

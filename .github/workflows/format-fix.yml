name: Format Fix (temporary)
# TEMPORARY workflow. Triggered by push to the feature branch (workflow_dispatch
# cannot target a branch-only workflow). Formats the two edited server files with
# the project's pinned Biome 1.9.4 and uploads them as an artifact. After the
# artifact is applied, this file is deleted in a follow-up commit.
on:
  push:
    branches: [feature/mvp-foundation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Format edited files with Biome 1.9.4
        run: bun run format:write
      - name: Upload formatted files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: formatted-files
          path: |
            src/server/config/index.ts
            src/server/bootstrap.ts

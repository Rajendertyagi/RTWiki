name: Format Fix
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/mvp-foundation
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Auto-format and safe-fix
        run: bun run format:fix
      - name: Typecheck gate
        run: bun run typecheck
      - name: Commit and push
        run: |
          git config user.name "RTWiki Bot"
          git config user.email "rtwiki@rtwiki.local"
          git add -A
          git diff --cached --quiet || (git commit -m "style: auto-format with Biome" && git push)

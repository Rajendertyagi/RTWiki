name: Format Fix

on:
  workflow_dispatch:
  push:
    branches: [feature/dependency-compat]
    paths:
      - "biome.json"
      - "**/*.ts"
      - "**/*.tsx"

permissions:
  contents: read

jobs:
  format-fix:
    name: Format fix
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Fix formatting
        run: |
          set +e
          bun run format:fix 2>&1 | tee /tmp/format-fix.log
          echo "EXIT_CODE=$?" >> $GITHUB_ENV
      - name: Commit formatted files
        run: |
          git config user.name "RTWiki"
          git config user.email "rtwiki@rtwiki.local"
          git add -A
          if git diff --cached --quiet; then
            echo "No formatting changes needed"
          else
            git commit -m "style: apply Biome 2.x formatting fixes"
            git push
          fi
      - name: Upload log
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: format-fix-log
          path: /tmp/format-fix.log
          retention-days: 1

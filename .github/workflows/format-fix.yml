name: Format Fix

# TEMPORARY workflow. Reformats/autofixes the tree on GitHub (never locally) and
# uploads the result as an artifact so it can be committed, then this file is deleted.
# `continue-on-error` ensures the artifact is still uploaded even if unfixable lint
# errors remain for the follow-up manual pass.
on:
  workflow_dispatch:
  push:
    branches:
      - feature/mvp-foundation

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/mvp-foundation
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Reformat and autofix
        continue-on-error: true
        run: bun run format:fix
      - name: Upload reformatted sources
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: formatted-src
          path: |
            src
            tests

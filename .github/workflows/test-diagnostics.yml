name: Test diagnostics

# TEMPORARY, read-only diagnostic workflow. Surfaces Playwright output
# through public check-run annotations because job logs require
# authentication this environment lacks.
on:
  push:
    branches: [feature/workspace-hierarchy]

permissions:
  contents: read

jobs:
  test-output:
    name: Surface test findings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Build web bundle
        run: bun run build:web
      - name: Run Playwright tree-dnd suite, capture output
        run: |
          set +e
          bunx playwright install --with-deps chromium
          bunx playwright test tests/browser/tree-dnd.pwspec.ts --reporter=line > pw-full.txt 2>&1
          echo "playwright exit: $?" >> pw-full.txt
          true
      - name: Emit output annotation chunks (first half)
        run: |
          {
            grep -E '✘|failed|passed|Error:|Timed out|waiting for' pw-full.txt | head -n 100 || true
            echo '--- tail ---'
            tail -n 25 pw-full.txt
          } > combined.txt
          TOTAL=$(base64 -w0 combined.txt | fold -w 4000 | wc -l)
          N=0
          for CHUNK in $(base64 -w0 combined.txt | fold -w 4000); do
            N=$((N+1))
            if [ "$N" -le 4 ]; then
              echo "::error title=tstout part $N of $TOTAL::$CHUNK"
            fi
          done
      - name: Emit output annotation chunks (remainder)
        run: |
          {
            grep -E '✘|failed|passed|Error:|Timed out|waiting for' pw-full.txt | head -n 100 || true
            echo '--- tail ---'
            tail -n 25 pw-full.txt
          } > combined.txt
          N=0
          for CHUNK in $(base64 -w0 combined.txt | fold -w 4000); do
            N=$((N+1))
            if [ "$N" -gt 4 ]; then
              echo "::error title=tstout part $N of $TOTAL::$CHUNK"
            fi
          done

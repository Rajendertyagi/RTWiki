name: Test diagnostics

# TEMPORARY, read-only diagnostic workflow. Surfaces `bun test` output
# through public check-run annotations because job logs require
# authentication this environment lacks.
# - Branch-specific trigger only
# - contents: read (no repository writes)
# - No secrets, no commits, no pushes from Actions
# - Deleted before the dependency-free baseline is declared complete
on:
  push:
    branches: [feature/workspace-hierarchy]

permissions:
  contents: read

jobs:
  test-output:
    name: Surface test findings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Run tests, capture output
        run: |
          set +e
          bun test > full.txt 2>&1
          echo "test exit: $?" >> full.txt
          true
      - name: Reduce output to failures and summary
        # Keep the payload under the public-annotation budget: only failing
        # test lines, the final counters, and any unhandled-error blocks.
        run: |
          {
            grep -E '\(fail\)|Unhandled error|error:|^ [0-9]+ (pass|fail)|Ran [0-9]+ tests' full.txt || true
            echo '--- tail ---'
            tail -n 40 full.txt
          } > test-output.txt
      - name: Run Playwright suite, capture output
        run: |
          set +e
          bunx playwright test --reporter=line > pw-full.txt 2>&1
          echo "playwright exit: $?" >> pw-full.txt
          true
      - name: Reduce Playwright output to failures and summary
        run: |
          {
            grep -E '✘|failed|passed|Error:|flaky|did not|Timed out|waiting for' pw-full.txt | head -n 120 || true
            echo '--- tail ---'
            tail -n 30 pw-full.txt
          } > pw-output.txt
      - name: Publish output annotations (first half)
        run: |
          cat test-output.txt pw-output.txt > combined.txt
          TOTAL=$(base64 -w0 combined.txt | fold -w 4000 | wc -l)
          N=0
          for CHUNK in $(base64 -w0 combined.txt | fold -w 4000); do
            N=$((N+1))
            if [ "$N" -le 4 ]; then
              echo "::error title=tstout part $N of $TOTAL::$CHUNK"
            fi
          done
      - name: Publish output annotations (remainder)
        run: |
          cat test-output.txt pw-output.txt > combined.txt
          TOTAL=$(base64 -w0 combined.txt | fold -w 4000 | wc -l)
          N=0
          for CHUNK in $(base64 -w0 combined.txt | fold -w 4000); do
            N=$((N+1))
            if [ "$N" -gt 4 ]; then
              echo "::error title=tstout part $N of $TOTAL::$CHUNK"
            fi
          done

# Temporary bootstrap workflow — generates bun.lock only
# This workflow is removed before the final commit.

name: Bootstrap Lockfile

on:
  push:
    branches: [feature/mvp-foundation]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bootstrap:
    name: Generate bun.lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # v4.1.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2 # v2.0.0
        with:
          bun-version: '1.3.14'

      - name: Generate lockfile only
        run: bun install --lockfile-only --ignore-scripts

      - name: Verify lockfile exists
        run: test -f bun.lock && echo "bun.lock generated successfully" || exit 1

      - name: Upload lockfile artifact
        uses: actions/upload-artifact@v4 # v4.3.0
        with:
          name: bun-lockfile-${{ github.sha }}
          path: bun.lock
          retention-days: 1

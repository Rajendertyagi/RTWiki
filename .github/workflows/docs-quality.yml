name: Documentation Quality

on:
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - "scripts/verify-docs.ts"
      - ".github/workflows/docs-quality.yml"
  pull_request:
    paths:
      - "**/*.md"
      - "scripts/verify-docs.ts"
      - ".github/workflows/docs-quality.yml"
  workflow_dispatch:

# Least-privilege: the verifier only reads the repository.
permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: docs-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-quality:
    name: Verify documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Bun 1.3.14
        # oven-sh/setup-bun v2.2.0
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Verify documentation
        # Dependency-free check; no `bun install`, no network, no third-party packages.
        run: bun scripts/verify-docs.ts

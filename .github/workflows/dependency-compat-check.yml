name: Dependency Compatibility Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve and verify compatible dependency set
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Create resolution script
        run: |
          cat > /tmp/resolve-deps.ts << 'SCRIPT'
          import { $ } from "bun"

          // Query latest stable version + peer deps for each package
          async function fetchPackage(pkg: string): Promise<{ version: string; peerDeps: Record<string, string>; deps: Record<string, string> }> {
            const url = `https://registry.npmjs.org/${pkg}`
            const res = await fetch(url)
            const data = await res.json() as { "dist-tags": { latest: string }; peersDependencies?: Record<string, string>; dependencies?: Record<string, string> }
            const version = data["dist-tags"].latest
            return {
              version,
              peerDeps: (data as any).peerDependencies ?? {},
              deps: (data as any).dependencies ?? {},
            }
          }

          const packages = [
            "@blocknote/core",
            "@blocknote/react",
            "@blocknote/mantine",
            "@mantine/core",
            "@mantine/hooks",
            "@mantine/utils",
            "react",
            "react-dom",
            "@types/react",
            "@vitejs/plugin-react",
            "typescript",
          ]

          const results: Record<string, { version: string; peerDeps: Record<string, string> }> = {}
          for (const pkg of packages) {
            try {
              const info = await fetchPackage(pkg)
              results[pkg] = { version: info.version, peerDeps: info.peerDeps }
              console.log(`${pkg}@${info.version}  peerDeps: ${JSON.stringify(info.peerDeps)}`)
            } catch (e) {
              console.error(`FAILED to fetch ${pkg}: ${e}`)
            }
          }

          // Write results
          const fs = require("fs")
          fs.writeFileSync("/tmp/npm-results.json", JSON.stringify(results, null, 2))
          console.log("\n=== WRITTEN /tmp/npm-results.json ===")
          SCRIPT
      - name: Query npm metadata
        run: bun run /tmp/resolve-deps.ts
      - name: Upload npm metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-metadata
          path: /tmp/npm-results.json
          retention-days: 1

  candidates:
    name: Test candidate dependency combinations
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Candidate A: BlockNote 0.54.x with Mantine 9.x and React 19.x
          - label: "A-blocknote-054-mantine-9-react-19"
            blocknote: "0.54.1"
            mantine: "9.5.1"
            react: "19.2.8"
            typesReact: "19.2.8"
          # Candidate B: BlockNote 0.54.x with Mantine 7.x and React 18.x
          - label: "B-blocknote-054-mantine-7-react-18"
            blocknote: "0.54.1"
            mantine: "7.15.0"
            react: "18.3.1"
            typesReact: "18.3.12"
          # Candidate C: BlockNote 0.54.x with Mantine 8.x and React 18/19
          - label: "C-blocknote-054-mantine-8-react-18"
            blocknote: "0.54.1"
            mantine: "8.0.2"
            react: "18.3.1"
            typesReact: "18.3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Download npm metadata
        uses: actions/download-artifact@c850b930e6ba138125429b7e8c991c2e43895df0 # v4.1.8
        with:
          name: npm-metadata
          path: /tmp
      - name: Print metadata
        run: cat /tmp/npm-results.json
      - name: Read existing package.json
        id: pkg
        run: |
          cat package.json
      - name: Build candidate package.json
        id: build
        run: |
          node - << 'EOF'
          const fs = require('fs');
          const meta = JSON.parse(fs.readFileSync('/tmp/npm-results.json', 'utf8'));
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));

          const m = process.env;
          const blocknoteVer = '${{ matrix.blocknote }}';
          const mantineVer = '${{ matrix.mantine }}';
          const reactVer = '${{ matrix.react }}';
          const typesReactVer = '${{ matrix.typesReact }}';

          // Update dependencies
          pkg.dependencies['@blocknote/core'] = blocknoteVer;
          pkg.dependencies['@blocknote/react'] = blocknoteVer;
          pkg.dependencies['@blocknote/mantine'] = blocknoteVer;
          pkg.dependencies['@mantine/core'] = mantineVer;
          pkg.dependencies['react'] = reactVer;
          pkg.dependencies['react-dom'] = reactVer;

          // Update devDependencies
          pkg.devDependencies['@types/react'] = typesReactVer;
          pkg.devDependencies['@types/react-dom'] = typesReactVer;

          // Ensure @mantine/hooks and @mantine/utils are present
          if (!pkg.dependencies['@mantine/hooks']) pkg.dependencies['@mantine/hooks'] = mantineVer;
          if (!pkg.dependencies['@mantine/utils']) pkg.dependencies['@mantine/utils'] = mantineVer;

          fs.writeFileSync('/tmp/candidate-package.json', JSON.stringify(pkg, null, 2) + '\n');
          console.log('Candidate package.json built');
          EOF
        env:
          blocknote: ${{ matrix.blocknote }}
          mantine: ${{ matrix.mantine }}
          react: ${{ matrix.react }}
          typesReact: ${{ matrix.typesReact }}
      - name: Write candidate package.json
        run: cp /tmp/candidate-package.json package.json
      - name: Remove existing lockfile to force regeneration
        run: rm -f bun.lock
      - name: Generate lockfile
        id: lock
        run: |
          set +e
          bun lock --update 2>&1 | tee /tmp/lock-output.txt
          EXIT_CODE=$?
          echo "LOCK_EXIT=$EXIT_CODE" >> $GITHUB_OUTPUT
          cat /tmp/lock-output.txt | tail -50
      - name: Check for peer dependency warnings
        id: peers
        run: |
          if grep -qi "peer dep\|peer-depend\|unmet peer\|missing peer" /tmp/lock-output.txt 2>/dev/null; then
            echo "PEER_WARNINGS=1" >> $GITHUB_OUTPUT
            grep -i "peer dep\|peer-depend\|unmet peer\|missing peer" /tmp/lock-output.txt | head -20
          else
            echo "PEER_WARNINGS=0" >> $GITHUB_OUTPUT
          fi
      - name: Install dependencies
        id: install
        run: |
          set +e
          bun install --frozen-lockfile 2>&1 | tee /tmp/install-output.txt
          echo "INSTALL_EXIT=$?" >> $GITHUB_OUTPUT
          cat /tmp/install-output.txt | tail -30
      - name: Check for duplicate React
        id: dup-react
        run: |
          REACT_COUNT=$(find node_modules -maxdepth 1 -name "react" -type d 2>/dev/null | wc -l)
          REACT_SUB=$(grep -r '"name": "react"' node_modules/react/package.json 2>/dev/null | head -3)
          echo "React top-level installs: $REACT_COUNT"
          # Check for multiple resolved react versions in lockfile
          LOCKFILE_REACT=$(grep -c '"react@' bun.lock 2>/dev/null || echo 0)
          echo "React entries in lockfile: $LOCKFILE_REACT"
          # Use bun pm ls to check
          bun pm ls react 2>/dev/null | tee /tmp/react-check.txt || true
          cat /tmp/react-check.txt
      - name: Check for duplicate Mantine
        id: dup-mantine
        run: |
          MANTINE_COUNT=$(find node_modules -maxdepth 1 -name "mantine*" -type d 2>/dev/null | wc -l)
          echo "Mantine top-level packages: $MANTINE_COUNT"
          bun pm ls "@mantine/core" 2>/dev/null | tee /tmp/mantine-check.txt || true
          cat /tmp/mantine-check.txt
      - name: Format check
        if: steps.install.outputs.INSTALL_EXIT == '0'
        run: bun run format:check 2>&1 | tee /tmp/format.txt || true
      - name: Lint
        if: steps.install.outputs.INSTALL_EXIT == '0'
        run: bun run lint 2>&1 | tee /tmp/lint.txt || true
      - name: Typecheck
        if: steps.install.outputs.INSTALL_EXIT == '0'
        run: bun run typecheck 2>&1 | tee /tmp/typecheck.txt || cat /dev/null
      - name: Test
        if: steps.install.outputs.INSTALL_EXIT == '0'
        run: bun test 2>&1 | tee /tmp/test.txt || true
      - name: Build web
        if: steps.install.outputs.INSTALL_EXIT == '0'
        run: bun run build:web 2>&1 | tee /tmp/build-web.txt || true
      - name: Build server
        if: steps.install.outputs.INSTALL_EXIT == '0'
        run: bun run build:server 2>&1 | tee /tmp/build-server.txt || true
      - name: Collect results
        if: always()
        run: |
          mkdir -p /tmp/results/${{ matrix.label }}
          cp package.json /tmp/results/${{ matrix.label }}/
          cp bun.lock /tmp/results/${{ matrix.label }}/ 2>/dev/null || true
          cp /tmp/npm-results.json /tmp/results/${{ matrix.label }}/npm-metadata.json
          cp /tmp/lock-output.txt /tmp/results/${{ matrix.label }}/lock-output.txt 2>/dev/null || true
          cp /tmp/install-output.txt /tmp/results/${{ matrix.label }}/install-output.txt 2>/dev/null || true
          cp /tmp/format.txt /tmp/results/${{ matrix.label }}/format.txt 2>/dev/null || true
          cp /tmp/lint.txt /tmp/results/${{ matrix.label }}/lint.txt 2>/dev/null || true
          cp /tmp/typecheck.txt /tmp/results/${{ matrix.label }}/typecheck.txt 2>/dev/null || true
          cp /tmp/test.txt /tmp/results/${{ matrix.label }}/test.txt 2>/dev/null || true
          cp /tmp/build-web.txt /tmp/results/${{ matrix.label }}/build-web.txt 2>/dev/null || true
          cp /tmp/build-server.txt /tmp/results/${{ matrix.label }}/build-server.txt 2>/dev/null || true
          cp /tmp/react-check.txt /tmp/results/${{ matrix.label }}/react-check.txt 2>/dev/null || true
          cp /tmp/mantine-check.txt /tmp/results/${{ matrix.label }}/mantine-check.txt 2>/dev/null || true
          # Write summary
          cat > /tmp/results/${{ matrix.label }}/summary.txt << SUMM
          Label: ${{ matrix.label }}
          BlockNote: ${{ matrix.blocknote }}
          Mantine: ${{ matrix.mantine }}
          React: ${{ matrix.react }}
          TypesReact: ${{ matrix.typesReact }}
          Lock generated: ${{ steps.lock.outputs.LOCK_EXIT == '0' && 'YES' || 'NO' }}
          Peer warnings: ${{ steps.peers.outputs.PEER_WARNINGS }}
          Install success: ${{ steps.install.outputs.INSTALL_EXIT == '0' && 'YES' || 'NO' }}
          Format passed: $(grep -q "All checks passed" /tmp/results/${{ matrix.label }}/format.txt 2>/dev/null && echo 'YES' || echo 'CHECK')
          Lint passed: $(grep -q "All checks passed" /tmp/results/${{ matrix.label }}/lint.txt 2>/dev/null && echo 'YES' || echo 'CHECK')
          Test passed: $(grep -q "All tests passed" /tmp/results/${{ matrix.label }}/test.txt 2>/dev/null && echo 'YES' || echo 'CHECK')
          Web build passed: $([ -f /tmp/results/${{ matrix.label }}/build-web.txt ] && grep -q "built" /tmp/results/${{ matrix.label }}/build-web.txt 2>/dev/null && echo 'YES' || echo 'NOT_RUN')
          Server build passed: $([ -f /tmp/results/${{ matrix.label }}/build-server.txt ] &grep -q "compiled\|success" /tmp/results/${{ matrix.label }}/build-server.txt 2>/dev/null && echo 'YES' || echo 'NOT_RUN')
          SUMM
          cat /tmp/results/${{ matrix.label }}/summary.txt
      - name: Upload candidate results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: results-${{ matrix.label }}
          path: /tmp/results/${{ matrix.label }}/
          retention-days: 1

  report:
    name: Generate compatibility report
    needs: candidates
    runs-on: ubuntu-latest
    steps:
      - name: Download all candidate results
        uses: actions/download-artifact@c850b930e6ba138125429b7e8c991c2e43895df0 # v4.1.8
        with:
          path: /tmp/all-results
          pattern: results-*
          merge-multiple: false
      - name: Print all summaries
        run: |
          echo "=========================================="
          echo "COMPATIBILITY REPORT"
          echo "=========================================="
          for d in /tmp/all-results/results-*/; do
            echo ""
            echo "── $(basename $d) ──"
            cat "$d/summary.txt" 2>/dev/null || echo "(no summary)"
            echo ""
            if [ -f "$d/install-output.txt" ]; then
              echo "Install output (last 10 lines):"
              tail -10 "$d/install-output.txt"
            fi
            echo ""
          done
      - name: Compile final report
        run: |
          cat > /tmp/final-report.md << 'REPORT'
          # Dependency Compatibility Report

          ## Methodology
          - Queried npm registry directly for latest stable versions and peer dependencies
          - Tested three candidate combinations on GitHub-hosted runners
          - Generated bun.lock for each candidate
          - Ran full CI gate suite: format, lint, typecheck, test, web build, server build
          - Checked for duplicate React and Mantine installations
          - No --force, --legacy-peer-deps, overrides, or resolutions used
          - No local package installation; all work performed on GitHub runners

          ## Current (Pre-Change) Dependencies
          REPORT

          node - << 'EOF' >> /tmp/final-report.md
          const pkg = JSON.parse(require('fs').readFileSync('package.json', 'utf8'));
          console.log('### Before any changes\n');
          console.log('| Package | Version |\n|---------|---------|\n');
          for (const [k, v] of Object.entries(pkg.dependencies)) console.log(`| ${k} | ${v} |\n`);
          for (const [k, v] of Object.entries(pkg.devDependencies)) console.log(`| ${k} | ${v} |\n`);
          EOF

          echo "## Candidates Tested" >> /tmp/final-report.md
          echo "" >> /tmp/final-report.md
      - name: Append candidate details
        run: |
          for d in /tmp/all-results/results-*/; do
            label=$(basename "$d")
            echo "### $label" >> /tmp/final-report.md
            echo "" >> /tmp/final-report.md
            cat "$d/summary.txt" >> /tmp/final-report.md
            echo "" >> /tmp/final-report.md
            if [ -f "$d/npm-metadata.json" ]; then
              echo "#### npm Registry Metadata" >> /tmp/final-report.md
              echo '```json' >> /tmp/final-report.md
              cat "$d/npm-metadata.json" >> /tmp/final-report.md
              echo '```' >> /tmp/final-report.md
              echo "" >> /tmp/final-report.md
            fi
          done
      - name: Upload final report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: compatibility-report
          path: /tmp/final-report.md
          retention-days: 7
      - name: Upload best candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: best-candidate
          path: |
            /tmp/all-results/results-B-blocknote-054-mantine-7-react-18/package.json
            /tmp/all-results/results-B-blocknote-054-mantine-7-react-18/bun.lock
          retention-days: 7

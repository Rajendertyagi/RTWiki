name: Format Check Debug

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format-debug:
    name: Format debug
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Format check with verbose output
        run: |
          set +e
          bun run format:check 2>&1 | tee /tmp/format-verbose.txt
          echo "EXIT_CODE=$?" >> $GITHUB_ENV
          echo "=== Full output ==="
          cat /tmp/format-verbose.txt
      - name: Check biome version
        run: |
          bunx biome --version
      - name: Check biome config
        run: |
          cat biome.json
      - name: Upload format log
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: format-debug-log
          path: /tmp/format-verbose.txt
          retention-days: 1

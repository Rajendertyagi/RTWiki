name: Format Check Debug

on:
  push:
    branches: [feature/dependency-compat]
    paths:
      - ".github/workflows/format-debug.yml"
      - "biome.json"
      - "**/*.ts"
      - "**/*.tsx"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format-debug:
    name: Format debug
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check biome installation
        run: |
          echo "=== node_modules/.bin contents ==="
          ls -la node_modules/.bin/ | grep biome
          echo ""
          echo "=== biome binary locations ==="
          find node_modules -name "biome" -type f 2>/dev/null
          find node_modules -name "biome" -type l 2>/dev/null
          echo ""
          echo "=== which biome ==="
          which biome || echo "biome not in PATH"
          echo ""
          echo "=== npx biome ==="
          npx biome --version 2>&1 || echo "npx biome failed"
          echo ""
          echo "=== bunx biome ==="
          bunx biome --version 2>&1 || echo "bunx biome failed"
          echo ""
          echo "=== Direct binary test ==="
          node_modules/.bin/biome --version 2>&1 || echo "direct binary failed"
          echo ""
          echo "=== Check biome package ==="
          cat node_modules/@biomejs/biome/package.json | grep -A5 '"bin"'
      - name: Format check
        run: |
          set +e
          bun run format:check 2>&1 | tee /tmp/format-verbose.txt
          echo "EXIT_CODE=$?" >> $GITHUB_ENV
          cat /tmp/format-verbose.txt
      - name: Upload format log
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: format-debug-log
          path: /tmp/format-verbose.txt
          retention-days: 1

name: Dependency lockfile generation

# TEMPORARY, read-only workflow. Generates package.json + bun.lock on a
# GitHub-hosted runner for the single authorized dependency addition.
# - Branch-specific trigger only
# - contents: read (no repository writes)
# - No secrets, no commits, no pushes from Actions
# - Deleted in the same focused commit that applies the generated files
on:
  push:
    branches: [feature/workspace-hierarchy]

permissions:
  contents: read

jobs:
  generate:
    name: Generate and validate dependency files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact approved baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: a9a0888e182e09bd50768f53dc744908774ec2c5
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
      - name: Add exact core dependency (runner-generated lockfile)
        run: bun add --exact @atlaskit/pragmatic-drag-and-drop@3.0.0
      - name: Validate exact direct dependency entry
        run: |
          node -e "const p=require('./package.json'); const v=p.dependencies['@atlaskit/pragmatic-drag-and-drop']; if(v!=='3.0.0'){console.error('unexpected version: '+v);process.exit(1)} console.log('direct dependency OK:',v)"
      - name: Clean frozen-lockfile install validation
        run: |
          mkdir -p /tmp/depcheck
          cp package.json bun.lock /tmp/depcheck/
          cd /tmp/depcheck
          bun install --frozen-lockfile
          test -d node_modules/@atlaskit/pragmatic-drag-and-drop
          echo "frozen install OK"
      - name: Hashes
        run: |
          sha256sum package.json bun.lock
          git diff --binary -- package.json bun.lock > deps.patch
          gzip -n -c deps.patch > deps.patch.gz
          echo "PATCH_SHA256=$(sha256sum deps.patch | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "GZ_SHA256=$(sha256sum deps.patch.gz | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "B64_LEN=$(base64 -w0 deps.patch.gz | wc -c)" >> "$GITHUB_ENV"
      - name: Upload generated dependency files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-dependency-files
          path: |
            package.json
            bun.lock
          if-no-files-found: error
          retention-days: 7
      - name: Public annotation fallback (chunk count + hashes)
        run: |
          B64=$(base64 -w0 deps.patch.gz)
          TOTAL=$(printf '%s' "$B64" | fold -w 4000 | wc -l)
          echo "::notice title=deppatch chunks::$TOTAL"
          echo "::notice title=deppatch patch sha256::$PATCH_SHA256"
          echo "::notice title=deppatch gzip sha256::$GZ_SHA256"
          echo "::notice title=deppatch b64 length::$B64_LEN"
      - name: Emit patch annotation chunks (first half)
        run: |
          B64=$(base64 -w0 deps.patch.gz)
          TOTAL=$(printf '%s' "$B64" | fold -w 4000 | wc -l)
          N=0
          for CHUNK in $(printf '%s' "$B64" | fold -w 4000); do
            N=$((N+1))
            if [ "$N" -le 4 ]; then
              echo "::error title=deppatch part $N of $TOTAL::$CHUNK"
            fi
          done
      - name: Emit patch annotation chunks (remainder)
        run: |
          B64=$(base64 -w0 deps.patch.gz)
          N=0
          for CHUNK in $(printf '%s' "$B64" | fold -w 4000); do
            N=$((N+1))
            if [ "$N" -gt 4 ]; then
              echo "::error title=deppatch part $N of $TOTAL::$CHUNK"
            fi
          done

name: Lockfile Artifact (temporary)

# TEMPORARY workflow — exists only to regenerate bun.lock for the parse5
# dependency addition without running any tooling on the owner's PC.
# It is read-only: it never commits, pushes, or writes to the repository.
# It must be deleted in the same corrective push that lands the verified
# lockfile. See docs/VISUAL_MVP_TRACKER.md Phase 4A.

on:
  push:
    branches: [feature/html-page-editor]
    paths:
      - 'package.json'
      - '.github/workflows/lockfile-artifact.yml'

permissions:
  contents: read

jobs:
  lockfile:
    name: Produce bun.lock artifact (no repository writes)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"

      # Resolves the dependency tree from package.json and writes bun.lock.
      # --lockfile-only performs no node_modules install.
      - name: Resolve lockfile only
        run: bun install --lockfile-only

      - name: Upload bun.lock artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bun-lockfile-parse5
          path: bun.lock
          if-no-files-found: error
          retention-days: 7

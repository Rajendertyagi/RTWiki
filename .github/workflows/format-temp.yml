name: Format verify-docs.ts
on:
  push:
    branches: [feature/mvp-foundation]
    paths: [scripts/verify-docs.ts]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/mvp-foundation
          token: "${{ secrets.GITHUB_TOKEN }}"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install
      - run: bun run biome check --write --linter-enabled=false --organize-imports-enabled=false scripts/verify-docs.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-docs.ts
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "style: format verify-docs.ts for biome compliance"
            git push
          fi